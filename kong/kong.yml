_format_version: "3.0"

# ---------------------------------------------------------------------------
# Serviços: um por microsserviço (nome do container na rede do compose).
# Timeouts espelham o antigo gateway: GATEWAY_TIMEOUT_S=30 total, connect 5s.
# retries: 0 = sem retry (paridade com o httpx do gateway Python).
# ---------------------------------------------------------------------------
services:
  - name: auth
    url: http://auth:8001
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: auth-docs
        strip_path: false
        paths: ["~/docs/auth/?$", '~/openapi/auth\.json$']
      # público: POST /tourists, POST /session, POST /session/refresh
      - name: auth-public
        methods: [POST]
        regex_priority: 100
        strip_path: false
        paths:
          - "~/api/v1/tourists/?$"
          - "~/api/v1/session/refresh/?$"
          - "~/api/v1/session/?$"
      # O corpo do logout autentica com refresh token; n?o requer access ainda v?lido.
      - name: auth-logout
        methods: [DELETE]
        regex_priority: 100
        strip_path: false
        paths: ["~/api/v1/session/?$"]
      # autenticado: todo o resto de /tourists /session /me /employees
      - name: auth-api
        strip_path: false
        paths:
          - "~/api/v1/(tourists|session|panel/users)(/.*)?$"
          - "~/api/v1/me(/interests)?/?$"
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: [exp]
              uri_param_names: []
              cookie_names: []
              run_on_preflight: false

  - name: catalog
    url: http://catalog:8002
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: catalog-docs
        strip_path: false
        paths: ["~/docs/catalog/?$", '~/openapi/catalog\.json$']
      # público: leitura do catálogo (lista, por id, deep links, categorias, eventos).
      # Nenhum prefixo público enraizado em /admin — GET /admin/tourist-spots/{id}
      # cai sempre na rota autenticada.
      - name: catalog-public-read
        methods: [GET]
        regex_priority: 100
        strip_path: false
        paths:
          - "~/api/v1/tourist-spots/?$"
          - "~/api/v1/tourist-spots/[^/]+/?$"
          - "~/api/v1/tourist-spots/[^/]+/external-links/?$"
          - "~/api/v1/categories/?$"
          - "~/api/v1/routes/?$"
          - "~/api/v1/events/?$"
      # autenticado: escrita de todos os prefixos + GET /admin/tourist-spots/*
      - name: catalog-api
        strip_path: false
        paths:
          - "~/api/v1/(tourist-spots|admin/tourist-spots|admin/events|categories|events)(/.*)?$"
          - "~/api/v1/routes(?:/[^/]+)?/?$"
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: [exp]
              uri_param_names: []
              cookie_names: []
              run_on_preflight: false

  - name: benefits
    url: http://benefits:8008
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: benefits-docs
        strip_path: false
        paths: ["~/docs/benefits/?$", '~/openapi/benefits\.json$']
      - name: benefits-api
        regex_priority: 110
        strip_path: false
        paths: ["~/api/v1/me/(balance|coupons)(/.*)?$", "~/api/v1/partners(/.*)?$"]
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: [exp]
              uri_param_names: []
              cookie_names: []
              run_on_preflight: false

  - name: gamification
    url: http://gamification:8004
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: gamification-docs
        strip_path: false
        paths: ["~/docs/gamification/?$", '~/openapi/gamification\.json$']
      - name: gamification-api
        strip_path: false
        paths:
          - "~/api/v1/(visits|enrollments|redemptions|prizes|badges|redeem-codes)(/.*)?$"
          - "~/api/v1/routes/[^/]+/enrollments/?$"
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: [exp]
              uri_param_names: []
              cookie_names: []
              run_on_preflight: false

  - name: insights
    url: http://insights:8005
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: insights-docs
        strip_path: false
        paths: ["~/docs/insights/?$", '~/openapi/insights\.json$']
      - name: insights-api
        strip_path: false
        paths: ["~/api/v1/(heatmap|accesses|rankings|distributions)(/.*)?$"]
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: [exp]
              uri_param_names: []
              cookie_names: []
              run_on_preflight: false

  - name: notifications
    url: http://notifications:8006
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: notifications-docs
        strip_path: false
        paths: ["~/docs/notifications/?$", '~/openapi/notifications\.json$']
      - name: notifications-api
        strip_path: false
        paths: ["~/api/v1/(subscriptions|notifications)(/.*)?$"]
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: [exp]
              uri_param_names: []
              cookie_names: []
              run_on_preflight: false

  - name: chatbot
    url: http://chatbot:8007
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: chatbot-docs
        strip_path: false
        paths: ["~/docs/chatbot/?$", '~/openapi/chatbot\.json$']
      - name: chatbot-api
        strip_path: false
        paths: ["~/api/v1/conversations(/.*)?$"]
        plugins:
          - name: jwt
            config:
              key_claim_name: kid
              claims_to_verify: [exp]
              uri_param_names: []
              cookie_names: []
              run_on_preflight: false

# ---------------------------------------------------------------------------
# RS256 credentials are appended from public key files by entrypoint-render.sh.
# ---------------------------------------------------------------------------
# Plugins globais.
# ---------------------------------------------------------------------------
plugins:
  # Correlation ID: gera ou propaga X-Request-Id para o upstream e o ecoa na
  # resposta (echo_downstream) — substitui o forward do X-Request-Id do gateway
  # Python; os serviços herdam o header pelo middleware de correlation ID.
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true

  - name: cors
    config:
      origins: ["__EDGE_CORS_ORIGIN__"]
      methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-Request-Id, Idempotency-Key]
      exposed_headers: [X-Request-Id]
      credentials: false
      max_age: 3600
      preflight_continue: false

  # Rate limiting por IP (policy local: Kong singleton DB-less, sem estado).
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      limit_by: ip
