# Kong Gateway — config declarativa DB-less: borda única em :8000 (D-02, Princípio V).
# Os marcadores __JWT_SECRET__ e __JWT_ISSUER__ são substituídos no boot por
# kong/entrypoint-render.sh a partir das envs JWT_SECRET / JWT_ISSUER do .env.
#
# Sintaxe de rotas Kong 3.x: caminhos regex com prefixo ~/, PCRE. O router do
# Kong casa a regex contra o path COMPLETO (incluindo a barra inicial) e o
# match é ancorado no início pela própria engine — a barra da regex se alinha
# com a barra do path; um `^` após `/` viraria literal. âncoras finais ($) e
# grupos (/.*)? funcionam normalmente. strip_path: false (os serviços esperam
# o path completo /api/v1/...).
#
# Estratégia: uma rota catch-all autenticada por serviço (todos os métodos e
# prefixos do serviço, plugin jwt) + rotas públicas com methods + regex ancorado
# e regex_priority 100 (vencem a rota autenticada, prioridade default 0, apenas
# onde método e path casam). A tabela completa de permissões coarse-grained do
# antigo gateway Python vivia em src/services/gateway/app/core/routing.py; aqui
# a borda aplica JWT e rate limit, e cada serviço repete RBAC via require_role.
_format_version: "3.0"

# ---------------------------------------------------------------------------
# Serviços: um por microsserviço (nome do container na rede do compose).
# Timeouts espelham o antigo gateway: GATEWAY_TIMEOUT_S=30 total, connect 5s.
# retries: 0 = sem retry (paridade com o httpx do gateway Python).
# ---------------------------------------------------------------------------
services:
  - name: auth
    url: http://auth:8001
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      # público: POST /tourists, POST /session, POST /session/refresh
      - name: auth-public
        methods: [POST]
        regex_priority: 100
        strip_path: false
        paths:
          - "~/api/v1/tourists/?$"
          - "~/api/v1/session/refresh/?$"
          - "~/api/v1/session/?$"
      # autenticado: todo o resto de /tourists /session /me /employees
      - name: auth-api
        strip_path: false
        paths:
          - "~/api/v1/(tourists|session|me|employees)(/.*)?$"
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: false

  - name: catalog
    url: http://catalog:8002
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      # público: leitura do catálogo (lista, por id, deep links, categorias, eventos).
      # Nenhum prefixo público enraizado em /admin — GET /admin/tourist-spots/{id}
      # cai sempre na rota autenticada.
      - name: catalog-public-read
        methods: [GET]
        regex_priority: 100
        strip_path: false
        paths:
          - "~/api/v1/tourist-spots/?$"
          - "~/api/v1/tourist-spots/[^/]+/?$"
          - "~/api/v1/tourist-spots/[^/]+/external-links/?$"
          - "~/api/v1/categories/?$"
          - "~/api/v1/events/?$"
      # autenticado: escrita de todos os prefixos + GET /admin/tourist-spots/*
      - name: catalog-api
        strip_path: false
        paths:
          - "~/api/v1/(tourist-spots|admin/tourist-spots|categories|events)(/.*)?$"
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: false

  - name: validation
    url: http://validation:8003
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: validation-api
        strip_path: false
        paths: ["~/api/v1/visits(/.*)?$"]
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: false

  - name: gamification
    url: http://gamification:8004
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      # público: apenas GET /routes exato — /routes/{id} e subpaths são autenticados
      - name: gamification-public-read
        methods: [GET]
        regex_priority: 100
        strip_path: false
        paths: ["~/api/v1/routes/?$"]
      # autenticado: todo o resto dos prefixos do serviço
      - name: gamification-api
        strip_path: false
        paths:
          - "~/api/v1/(routes|enrollments|redemptions|prizes|badges|redeem-codes)(/.*)?$"
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: false

  - name: insights
    url: http://insights:8005
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: insights-api
        strip_path: false
        paths: ["~/api/v1/(heatmap|accesses|rankings|distributions)(/.*)?$"]
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: false

  - name: notifications
    url: http://notifications:8006
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: notifications-api
        strip_path: false
        paths: ["~/api/v1/(subscriptions|notifications)(/.*)?$"]
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: false

  - name: chatbot
    url: http://chatbot:8007
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    retries: 0
    routes:
      - name: chatbot-api
        strip_path: false
        paths: ["~/api/v1/conversations(/.*)?$"]
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify: [exp]
              run_on_preflight: false

# ---------------------------------------------------------------------------
# Consumer + credencial JWT: o plugin jwt procura a credencial cuja `key`
# aparece no claim `iss` do token (key_claim_name: iss) e valida a assinatura
# HS256 com `secret`. key deve == JWT_ISSUER; secret deve == JWT_SECRET.
# ---------------------------------------------------------------------------
consumers:
  - username: passanorte-edge
    jwt_secrets:
      - algorithm: HS256
        key: __JWT_ISSUER__
        secret: __JWT_SECRET__

# ---------------------------------------------------------------------------
# Plugins globais.
# ---------------------------------------------------------------------------
plugins:
  # Correlation ID: gera ou propaga X-Request-Id para o upstream e o ecoa na
  # resposta (echo_downstream) — substitui o forward do X-Request-Id do gateway
  # Python; os serviços herdam o header pelo middleware de correlation ID.
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true

  # CORS central — paridade com ALLOWED_ORIGINS="*" do antigo gateway
  # (allow_credentials=false quando "*"; expõe X-Request-Id ao browser).
  - name: cors
    config:
      origins: ["*"]
      methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: ["*"]
      exposed_headers: [X-Request-Id]
      credentials: false
      max_age: 3600
      preflight_continue: false

  # Rate limiting por IP (policy local: Kong singleton DB-less, sem estado).
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      limit_by: ip