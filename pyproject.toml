[project]
name = "passanorte-backend"
version = "0.1.0"
description = "Backend do SPD-PassaNorte: sistema distribuído de gamificação do turismo de Manaus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyjwt",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: Depends() em defaults é o padrão idiomático do FastAPI
# UP042: str+Enum é o padrão exigido pelo SQLAlchemy para persistir enums
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# src/ é a raiz de imports (services.* e shared.* resolvem a partir daí)
mypy_path = "src"
# services/<svc>/ não tem __init__.py (namespace packages): evita conflito de módulos
explicit_package_bases = true
# os 7 alembic/env.py têm o mesmo nome de módulo (um por serviço)
exclude = ["alembic/"]

[tool.coverage.run]
source = ["src/services", "src/shared"]