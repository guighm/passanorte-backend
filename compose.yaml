# Healthcheck compartilhado: chama /health do próprio serviço na PORT dele
# (a imagem não tem curl; urlopen lançará erro em qualquer status != 2xx).
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 10s

services:
  db:
    # imagem com a extensão pgvector embutida (D-08, banco passanorte_chatbot)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: passanorte
      POSTGRES_PASSWORD: passanorte
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passanorte"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # barramento de eventos entre serviços (aio-pika): exchange topic
    # passanorte.events + DLX passanorte.dlx/DLQ; UI de gestão em :15672
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: passanorte
      RABBITMQ_DEFAULT_PASS: passanorte
    ports:
      - "127.0.0.1:5672:5672"   # AMQP (loopback)
      - "127.0.0.1:15672:15672" # management UI (loopback)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dbgate:
    # cliente web de administração dos bancos Postgres (debug local);
    # conexões pré-configuradas via env (todas as bases passanorte_*)
    image: dbgate/dbgate:alpine
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      CONNECTIONS: con1
      ENGINE_con1: postgres@dbgate-plugin-postgres
      SERVER_con1: db
      PORT_con1: "5432"
      USER_con1: passanorte
      PASSWORD_con1: passanorte
      LABEL_con1: SPD Postgres
      READONLY_con1: "false"
    depends_on:
      db: { condition: service_healthy }

  migrate:
    # one-shot: aplica as migrações Alembic (alembic upgrade head) de cada
    # serviço no respectivo database antes dos serviços subirem. Roda depois do
    # init-databases.sh (só cria os databases/extensões — este script não pode
    # rodar Alembic, pois executa dentro do container do Postgres). Idempotente:
    # revisões já aplicadas são puladas via alembic_version.
    build: { context: ., dockerfile: Dockerfile }
    command: bash scripts/apply_migrations.sh
    environment:
      DATABASE_URL_TEMPLATE: postgresql://passanorte:passanorte@db:5432/passanorte_{svc}
    depends_on:
      db: { condition: service_healthy }

  seed:
    # one-shot: cria o admin inicial (RF01) após as migrações. Idempotente
    # (--if-missing): em boots seguintes apenas registra que já existe.
    # Senha: $ADMIN_PASSWORD; se vazia, gera aleatória e imprime nos logs.
    build: { context: ., dockerfile: Dockerfile }
    command:
      - python
      - scripts/create_admin.py
      - --if-missing
      - --email
      - ${ADMIN_EMAIL:-admin@passanorte.com}
      - --password
      - ${ADMIN_PASSWORD:-}
    environment:
      DATABASE_URL: postgresql://passanorte:passanorte@db:5432/passanorte_auth
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  auth:
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn services.auth.app.main:app --host 0.0.0.0 --port 8001
    # portas dos serviços expostas apenas no loopback (debug local);
    # clientes acessam tudo via Kong em :8000
    ports: ["127.0.0.1:8001:8001"]
    environment: &svc_env
      PORT: "8001"
      DATABASE_URL: postgresql://passanorte:passanorte@db:5432/passanorte_auth
      RABBITMQ_URL: amqp://passanorte:passanorte@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      AUTH_SERVICE_URL: http://auth:8001
      CATALOG_SERVICE_URL: http://catalog:8002
      VALIDATION_SERVICE_URL: http://validation:8003
      GAMIFICATION_SERVICE_URL: http://gamification:8004
      INSIGHTS_SERVICE_URL: http://insights:8005
      NOTIFICATIONS_SERVICE_URL: http://notifications:8006
      CHATBOT_SERVICE_URL: http://chatbot:8007
    # admin inicial precisa existir antes do auth subir (seed depende do migrate)
    depends_on:
      db: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "python -c \"import os,urllib.request as u; u.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health')\""]

  catalog:
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn services.catalog.app.main:app --host 0.0.0.0 --port 8002
    ports: ["127.0.0.1:8002:8002"]
    environment:
      <<: *svc_env
      PORT: "8002"
      DATABASE_URL: postgresql://passanorte:passanorte@db:5432/passanorte_catalog
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "python -c \"import os,urllib.request as u; u.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health')\""]

  validation:
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn services.validation.app.main:app --host 0.0.0.0 --port 8003
    ports: ["127.0.0.1:8003:8003"]
    environment:
      <<: *svc_env
      PORT: "8003"
      DATABASE_URL: postgresql://passanorte:passanorte@db:5432/passanorte_validation
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "python -c \"import os,urllib.request as u; u.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health')\""]

  gamification:
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn services.gamification.app.main:app --host 0.0.0.0 --port 8004
    ports: ["127.0.0.1:8004:8004"]
    environment:
      <<: *svc_env
      PORT: "8004"
      DATABASE_URL: postgresql://passanorte:passanorte@db:5432/passanorte_gamification
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "python -c \"import os,urllib.request as u; u.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health')\""]

  insights:
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn services.insights.app.main:app --host 0.0.0.0 --port 8005
    ports: ["127.0.0.1:8005:8005"]
    environment:
      <<: *svc_env
      PORT: "8005"
      DATABASE_URL: postgresql://passanorte:passanorte@db:5432/passanorte_insights
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "python -c \"import os,urllib.request as u; u.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health')\""]

  notifications:
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn services.notifications.app.main:app --host 0.0.0.0 --port 8006
    ports: ["127.0.0.1:8006:8006"]
    environment:
      <<: *svc_env
      PORT: "8006"
      DATABASE_URL: postgresql://passanorte:passanorte@db:5432/passanorte_notifications
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "python -c \"import os,urllib.request as u; u.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health')\""]

  chatbot:
    build: { context: ., dockerfile: Dockerfile }
    command: uvicorn services.chatbot.app.main:app --host 0.0.0.0 --port 8007
    ports: ["127.0.0.1:8007:8007"]
    environment:
      <<: *svc_env
      PORT: "8007"
      DATABASE_URL: postgresql://passanorte:passanorte@db:5432/passanorte_chatbot
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "python -c \"import os,urllib.request as u; u.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health')\""]

  kong:
    # borda única em :8000 — config declarativa DB-less renderizada no boot
    # (kong/entrypoint-render.sh substitui __JWT_SECRET__/__JWT_ISSUER__ do .env)
    image: kong:3.9
    entrypoint: ["/bin/sh", "/kong/entrypoint-render.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_ACCESS_LOG: /dev/stderr
      KONG_ADMIN_ERROR_ACCESS_LOG: /dev/stderr
      # Admin API desligada: em modo ro DB-less toda a config vem do arquivo;
      # para deck/dashboard, troque por "localhost:8001"
      KONG_ADMIN_LISTEN: "off"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ISSUER: ${JWT_ISSUER:-passanorte}
    ports:
      - "8000:8000"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
      - ./kong/entrypoint-render.sh:/kong/entrypoint-render.sh:ro
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }
      catalog: { condition: service_healthy }
      validation: { condition: service_healthy }
      gamification: { condition: service_healthy }
      insights: { condition: service_healthy }
      notifications: { condition: service_healthy }
      chatbot: { condition: service_healthy }

volumes:
  pgdata:
  rabbitmqdata: