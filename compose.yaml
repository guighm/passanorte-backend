x-environment: &environment
  APP_ENV: ${APP_ENV:-production}
  RABBITMQ_URL_FILE: /run/secrets/rabbit_url
  JWT_PUBLIC_KEYS_DIR: /run/public-keys
  JWT_ISSUER: ${JWT_ISSUER:-passanorte}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-passanorte-api}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
  CATALOG_SERVICE_URL: http://catalog:8002
  AUTH_SERVICE_URL: http://auth:8001
  BENEFITS_SERVICE_URL: http://benefits:8008
  GAMIFICATION_SERVICE_URL: http://gamification:8004
  EDGE_PUBLIC_URL: ${EDGE_PUBLIC_URL:-https://localhost:8443}
  DEPLOYMENT_CITY: ${DEPLOYMENT_CITY:-Manaus}
  DEPLOYMENT_TIMEZONE: ${DEPLOYMENT_TIMEZONE:-America/Manaus}
  DEPLOYMENT_LANGUAGE: ${DEPLOYMENT_LANGUAGE:-pt-BR}
  MAP_CENTER_LATITUDE: ${MAP_CENTER_LATITUDE:--3.119}
  MAP_CENTER_LONGITUDE: ${MAP_CENTER_LONGITUDE:--60.0217}

x-service: &service
  build: {context: ., target: runtime}
  restart: unless-stopped
  init: true
  networks: [edge, data]
  mem_limit: 512m
  cpus: 1
  volumes:
    - ${SECRETS_DIR:-./secrets}/public:/run/public-keys:ro
  depends_on:
    db: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    restart: unless-stopped
    environment:
      POSTGRES_USER: passanorte
      POSTGRES_DB: passanorte
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    networks: [data]
    mem_limit: 768m
    volumes:
      - pgdata_s2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "passanorte", "-d", "passanorte"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec", "export RABBITMQ_DEFAULT_PASS=$$(cat /run/secrets/rabbit_password); exec docker-entrypoint.sh rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: passanorte
    secrets: [rabbit_password]
    networks: [data]
    mem_limit: 768m
    volumes: [rabbitmqdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  provision:
    build: {context: ., target: runtime}
    command: ["python", "scripts/provision_database.py"]
    networks: [data]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_CREDENTIAL_DIR: /run/secrets
    secrets:
      - postgres_password
      - {source: database_auth_migrator, target: database-auth_migrator}
      - {source: database_catalog_migrator, target: database-catalog_migrator}
      - {source: database_gamification_migrator, target: database-gamification_migrator}
      - {source: database_insights_migrator, target: database-insights_migrator}
      - {source: database_notifications_migrator, target: database-notifications_migrator}
      - {source: database_chatbot_migrator, target: database-chatbot_migrator}
      - {source: database_benefits_migrator, target: database-benefits_migrator}
      - {source: database_auth_runtime, target: database-auth_runtime}
      - {source: database_catalog_runtime, target: database-catalog_runtime}
      - {source: database_gamification_runtime, target: database-gamification_runtime}
      - {source: database_insights_runtime, target: database-insights_runtime}
      - {source: database_notifications_runtime, target: database-notifications_runtime}
      - {source: database_chatbot_runtime, target: database-chatbot_runtime}
      - {source: database_benefits_runtime, target: database-benefits_runtime}
    depends_on:
      db: {condition: service_healthy}

  migrate:
    build: {context: ., target: runtime}
    command: ["bash", "scripts/apply_migrations.sh"]
    networks: [data]
    environment:
      DB_CREDENTIAL_DIR: /run/secrets
    secrets:
      - {source: database_auth_migrator, target: database-auth_migrator}
      - {source: database_catalog_migrator, target: database-catalog_migrator}
      - {source: database_gamification_migrator, target: database-gamification_migrator}
      - {source: database_insights_migrator, target: database-insights_migrator}
      - {source: database_notifications_migrator, target: database-notifications_migrator}
      - {source: database_chatbot_migrator, target: database-chatbot_migrator}
      - {source: database_benefits_migrator, target: database-benefits_migrator}
    depends_on:
      provision: {condition: service_completed_successfully}

  seed:
    networks: [data]
    build: {context: ., target: runtime}
    command: ["python", "scripts/create_admin.py", "--if-missing", "--email", "${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL_FILE: /run/secrets/database_auth
      RABBITMQ_URL_FILE: /run/secrets/rabbit_url
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [database_auth, rabbit_url, admin_password]
    depends_on:
      migrate: {condition: service_completed_successfully}

  auth:
    <<: *service
    command: ["uvicorn", "services.auth.app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *environment
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      DATABASE_URL_FILE: /run/secrets/database_auth
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?Set JWT_ACTIVE_KID}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii
      PII_HMAC_KEY_FILE: /run/secrets/pii_hmac
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      seed: {condition: service_completed_successfully}
    secrets: [database_auth, rabbit_url, internal_api_token, jwt_private, pii, pii_hmac]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  catalog:
    <<: *service
    command: ["uvicorn", "services.catalog.app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *environment
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      DATABASE_URL_FILE: /run/secrets/database_catalog
    secrets: [database_catalog, rabbit_url, internal_api_token]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  gamification:
    <<: *service
    command: ["uvicorn", "services.gamification.app.main:app", "--host", "0.0.0.0", "--port", "8004"]
    environment:
      <<: *environment
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      DATABASE_URL_FILE: /run/secrets/database_gamification
    secrets: [database_gamification, rabbit_url, internal_api_token]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  insights:
    <<: *service
    command: ["uvicorn", "services.insights.app.main:app", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_insights
    secrets: [database_insights, rabbit_url]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  notifications:
    <<: *service
    command: ["uvicorn", "services.notifications.app.main:app", "--host", "0.0.0.0", "--port", "8006"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_notifications
    secrets: [database_notifications, rabbit_url]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  chatbot:
    profiles: [chatbot]
    <<: *service
    command: ["uvicorn", "services.chatbot.app.main:app", "--host", "0.0.0.0", "--port", "8007"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_chatbot
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_OLLAMA_URL: ${LLM_OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_OLLAMA_MODEL: ${LLM_OLLAMA_MODEL:-llama3.1}
    secrets: [database_chatbot, rabbit_url]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  benefits:
    <<: *service
    command: ["uvicorn", "services.benefits.app.main:app", "--host", "0.0.0.0", "--port", "8008"]
    environment:
      <<: *environment
      DATABASE_URL_FILE: /run/secrets/database_benefits
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
    secrets: [database_benefits, rabbit_url, internal_api_token]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  kong:
    image: kong:3.9.1@sha256:76c14b93e989f7f4418039f7f9789ca32564016211c86ac1a18022f4788e7b9c
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/kong/entrypoint-render.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8443 ssl"
      KONG_SSL_CERT: /run/secrets/edge_cert
      KONG_SSL_CERT_KEY: /run/secrets/edge_key
      EDGE_CORS_ORIGIN: ${EDGE_CORS_ORIGIN:-https://localhost:8443}
      JWT_PUBLIC_KEYS_DIR: /run/public-keys
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [edge]
    secrets: [edge_cert, edge_key]
    ports: ["8443:8443"]
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
      - ./kong/entrypoint-render.sh:/kong/entrypoint-render.sh:ro
      - ${SECRETS_DIR:-./secrets}/public:/run/public-keys:ro
    depends_on:
      auth: {condition: service_healthy}
      catalog: {condition: service_healthy}
      gamification: {condition: service_healthy}
      insights: {condition: service_healthy}
      notifications: {condition: service_healthy}
      benefits: {condition: service_healthy}

networks:
  edge: {}
  data:
    internal: true

volumes:
  pgdata_s2:
  rabbitmqdata:

